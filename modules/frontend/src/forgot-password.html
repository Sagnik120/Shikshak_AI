<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — Shikshak AI</title>
<meta name="description" content="Request a code to reset your Shikshak AI password.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='3.5' fill='%232A3FA0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-layout">
  <div class="auth-panel" style="grid-column:1/-1">
    <div class="auth-card">
      <a class="brand auth-brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M7 16C7 11.03 11.03 7 16 7" stroke="var(--indigo-600)" stroke-width="3" stroke-linecap="round"/>
          <path d="M25 16C25 20.97 20.97 25 16 25" stroke="var(--teal-600)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="3.5" fill="var(--indigo-600)"/>
        </svg>
        <span>Shikshak<span class="ai">AI</span></span>
      </a>

      <header>
        <h1>Forgot your password?</h1>
        <p>Enter the email on your account and we'll generate a code to reset it.</p>
      </header>

      <div class="alert" id="form-alert" hidden></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label class="label" for="email">Email address</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required autofocus>
          <span class="field-error"></span>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn" style="margin-top:var(--sp-5)">
          Send reset code
        </button>
      </form>

      <div class="auth-footer">
        Remembered it? <a href="/login.html">Back to sign in</a>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
