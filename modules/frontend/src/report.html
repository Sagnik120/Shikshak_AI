<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson report — Shikshak AI</title>
<meta name="description" content="Your results for this lesson, concept by concept.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='3.5' fill='%232A3FA0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="page-loader" id="page-loader">
  <svg class="page-loader-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <path d="M7 16C7 11.03 11.03 7 16 7" stroke="#2A3FA0" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 16C25 20.97 20.97 25 16 25" stroke="#0FA3A3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="3.5" fill="#2A3FA0"/>
  </svg>
  <span class="page-loader-label">Shikshak<span class="ai">AI</span></span>
</div>
<script>
(function () {
  var t0 = Date.now(), MIN_MS = 380;
  function hide() {
    var el = document.getElementById("page-loader");
    if (!el) return;
    var wait = Math.max(0, MIN_MS - (Date.now() - t0));
    setTimeout(function () {
      el.setAttribute("data-hide", "");
      setTimeout(function () { el.remove(); }, 420);
    }, wait);
  }
  if (document.readyState === "complete") hide();
  else window.addEventListener("load", hide);
})();
</script>

<a class="skip-link" href="#main">Skip to content</a>
<header id="app-header"></header>
<main id="main" class="page">
  <div class="container" id="report-root">
    <div class="stack" style="--gap:var(--sp-5)">
      <div class="skeleton" style="height:40px;max-width:420px"></div>
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:320px"></div>
    </div>
  </div>
</main>
<script type="module" src="/js/pages/report.js"></script>
</body>
</html>
